- id: remix
  title: Director of Design
  company: Remix
  meta: 2022
  context: >
    Remix is a web framework startup — acquired by Shopify — building
    an alternative to the client-heavy default of React apps.
  role: >
    Design leadership, developer education, and hands-on UI and front-end work around data loading,
    routing, and the launch of React Router 6.4.
  examples: >
    I wrote highly-valued articles by the community on topics like <a href="https://remix.run/blog/remix-and-the-edge">the edge</a> and
    <a href="https://remix.run/blog/remix-data-flow">data flow in Remix</a>. Here’s an example of my contributions to
    <a href="https://blog.jim-nielsen.com/2022/my-contribution-to-react-router/">shipping React Router 6.4</a>.

