- id: sagesure
  title: Director of Design
  company: SageSure
  tag: jobSagesure
  meta: 2016–2022
  blurb: Insurance technology company that grew roughly 10× during my tenure.
  bullets:
    - Led design for replacing the company’s Flash-based Agent Portal before browser support ended, successfully moving all new policy bindings—the company’s primary revenue channel—to the new system.
    - Designed Policy Actions, a system for configuring state-specific insurance rules and enabling self-service policy changes across agent and internal applications, dramatically reducing reliance on the call center.
    - Led design across strategic, cross-team initiatives—including the company’s expansion into commercial insurance, a next-generation quoting experience, and paperless billing—using prototypes to define direction, align teams, and validate ideas before implementation.
    - Helped establish design as an internal function and grow it from one designer plus contractors to a team of 5+, introducing shared practices for defining problems and collaborating across product teams.
    - Established front-end engineering as a dedicated discipline, helped hire its foundational engineers, and championed the company’s first design system across its product portfolio.

