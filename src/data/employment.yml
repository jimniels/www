- id: quadratic
  title: Founding Engineer
  company: Quadratic
  tag: jobQuadratic
  meta: 2023–Now
  blurb: Spreadsheet startup powered by code and AI.
  bullets:
    - First full-time hire and employee three; helped mature a browser-local prototype into a cloud-based collaborative product serving 350,000+ registered users and supporting a $5.6M seed round led by GV.
    - Partnered with the founder on cloud architecture and led its full-stack implementation using React, Express.js, and Postgres, including migrating user files from localStorage and replacing Auth0 with WorkOS.
    - Designed and built the product layer surrounding the spreadsheet, including file management, team workspaces, dashboards, third-party data connections, and a ground-up access-control model governing sharing within and across teams.
    - Shaped product direction through customer interviews, usage and AI-prompt analysis, rapid prototyping, and session-replay insights as the company grew from 3 to 10 people.

- id: remix
  title: Director of Design
  company: Remix
  tag: remix
  meta: 2022
  blurb: Open-source web framework startup, acquired by Shopify shortly after I joined.
